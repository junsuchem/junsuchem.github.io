<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patents | Junsu Ha</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #222;
    line-height: 1.6;
  }

  .navbar {
    background-color: #333;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  .navbar a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
    font-size: 17px;
  }
  .navbar a:hover { background-color: #ddd; color: black; }
  .navbar a.active { background-color: #002F5F; color: white; }

  .content { padding: 40px 20px; max-width: 1100px; margin: 0 auto; }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #002F5F;
    text-decoration: none;
    font-weight: bold;
  }
  .back-link:hover { text-decoration: underline; }

  h1 { margin-bottom: 4px; }
  .page-subtitle { color: #666; margin-bottom: 36px; }

  .pat-item {
    display: flex;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid #e5e5e5;
  }
  .pat-item:first-of-type { border-top: 1px solid #e5e5e5; }

  .pat-main { flex: 1; min-width: 0; }

  .pat-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    font-size: 0.85em;
  }
  .pat-number {
    background: #333;
    color: white;
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: bold;
  }
  .pat-tag {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 2px 10px;
    color: #444;
  }
  .pat-tag.status-granted {
    background: #e6f7ef;
    border-color: #002F5F;
    color: #002F5F;
    font-weight: bold;
  }
  .pat-tag.status-pending {
    background: #fff6e0;
    border-color: #e0a800;
    color: #a97400;
    font-weight: bold;
  }

  .pat-title { font-size: 1.1em; font-weight: bold; margin-bottom: 6px; }
  .pat-inventors { font-size: 0.95em; color: #333; margin-bottom: 4px; }
  .pat-inventors .me { text-decoration: underline; }
  .pat-meta { font-size: 0.95em; color: #555; margin-bottom: 4px; }
  .pat-link {
    font-size: 0.9em;
    color: #002F5F;
    text-decoration: none;
    font-weight: bold;
  }
  .pat-link:hover { text-decoration: underline; }

  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 0.85em;
    border-top: 1px solid #eee;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="research.html">Research</a>
  <a href="publications.html">Publications</a>
  <a class="active" href="patents.html">Patents</a>
</div>

<div class="content">
  <a class="back-link" href="index.html">&larr; Back to Home</a>
  <h1>Patents</h1>
  <p class="page-subtitle">A list of patents filed/granted by Junsu Ha</p>

  <div id="pat-list"></div>
</div>

<footer>&copy; 2026 Junsu Ha</footer>

<script>
/* ============================================================
   여기에 특허를 추가/수정하세요.
   배열의 첫 항목이 리스트의 맨 위(최신)로 표시됩니다.
   번호는 자동으로 매겨지므로 순서만 신경 쓰면 됩니다.

   각 필드 설명:
   - country    : 출원/등록 국가 (배지에 표시, 예: "KR", "US", "PCT")
   - status     : "Granted" | "Pending" | "Filed" 등 (배지 색상이 자동으로 바뀜)
   - title      : 특허명
   - inventors  : 발명자 목록 문자열. 본인 이름은
                  <span class="me">Ha, J.</span> 처럼 감싸면 밑줄로 강조됩니다.
   - meta       : 출원번호/등록번호, 출원일/등록일 등 (예: "Application No. 10-2026-XXXXXXX, filed 2026.03.15")
   - link       : 특허 상세 페이지 링크 (KIPRIS, Google Patents 등). 없으면 "" 로 둘 것
   ============================================================ */

  const patents = [
    {
      country: "KR",
      status: "Pending",
      title: "[Patent title]",
      inventors: '<span class="me">Ha, J.</span>; Co-inventor, A.;',
      meta: "Application No. 10-2026-XXXXXXX, filed 2026.MM.DD",
      link: ""
    },
    {
      country: "PCT",
      status: "Granted",
      title: "[Patent title]",
      inventors: '<span class="me">Ha, J.</span>; Co-inventor, B.; Co-inventor, C.;',
      meta: "Patent No. XX-XXXXXXX, granted 2025.MM.DD",
      link: "https://patents.google.com/patent/XXXXXXX"
    }
    // 새 특허 추가 시 여기 아래에 { ... }, 형태로 계속 이어 붙이면 됩니다.
  ];

  const listEl = document.getElementById("pat-list");
  const total = patents.length;

  patents.forEach((pat, i) => {
    const number = total - i;
    const statusKey = pat.status.toLowerCase();
    const statusClass = statusKey.includes("grant") ? "status-granted"
                        : statusKey.includes("pending") ? "status-pending" : "";

    const item = document.createElement("div");
    item.className = "pat-item";

    item.innerHTML = `
      <div class="pat-main">
        <div class="pat-badges">
          <span class="pat-number">${number}</span>
          <span class="pat-tag">${pat.country}</span>
          <span class="pat-tag ${statusClass}">${pat.status}</span>
        </div>
        <div class="pat-title">${pat.title}</div>
        <div class="pat-inventors">${pat.inventors}</div>
        <div class="pat-meta">${pat.meta}</div>
        ${pat.link ? `<a class="pat-link" href="${pat.link}" target="_blank" rel="noopener">Link &gt;</a>` : ""}
      </div>
    `;

    listEl.appendChild(item);
  });
</script>

</body>
</html>
