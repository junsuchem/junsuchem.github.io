<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Publications | Junsu Ha</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #222;
    line-height: 1.6;
  }
  .navbar {
    background-color: #333;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  .navbar a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
    font-size: 17px;
  }
  .navbar a:hover { background-color: #ddd; color: black; }
  .navbar a.active { background-color: #002F5F; color: white; }
  .content { padding: 40px 20px; max-width: 1140px; margin: 0 auto; }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #002F5F;
    text-decoration: none;
    font-weight: bold;
  }
  .back-link:hover { text-decoration: underline; }
  h1 { margin-bottom: 4px; }
  .page-subtitle { color: #666; margin-bottom: 36px; }
  .pub-item {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 22px 0;
    border-bottom: 1px solid #e5e5e5;
  }
  .pub-item:first-of-type { border-top: 1px solid #e5e5e5; }
  .pub-toc img {
    display: block;
    max-width: 100%;
    max-height: 6cm;
    width: auto;
    height: auto;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #f7f7f7;
  }
  .pub-main { flex: 1; min-width: 0; }
  .pub-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    font-size: 0.85em;
  }
  .pub-number {
    background: #333;
    color: white;
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: bold;
  }
  .pub-tag {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 2px 10px;
    color: #444;
  }
  .pub-tag.role-first {
    background: #e6eef7;
    border-color: #002F5F;
    color: #002F5F;
    font-weight: bold;
  }
  .pub-tag.status-tag {
    background: #fff6e0;
    border-color: #e0a800;
    color: #a97400;
    font-weight: bold;
  }
  .pub-title { font-size: 1.1em; font-weight: bold; margin-bottom: 6px; }
  .pub-authors { font-size: 0.95em; color: #333; margin-bottom: 4px; }
  .pub-authors .me { text-decoration: underline; }
  .pub-authors sup { font-size: 0.75em; }
  .pub-journal { font-size: 0.95em; color: #555; margin-bottom: 4px; }
  .pub-note { font-size: 0.9em; color: #777; font-style: italic; margin-bottom: 4px; }
  .year-heading {
    font-size: 1.4em;
    font-weight: bold;
    color: #002F5F;
    margin: 40px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 3px solid #002F5F;
  }
  .year-heading:first-child { margin-top: 0; }
  .pub-title a {
    color: inherit;
    text-decoration: none;
  }
  .pub-title a:hover { text-decoration: underline; color: #002F5F; }
  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 0.85em;
    border-top: 1px solid #eee;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="profile.html">Profile</a>
  <a href="research.html">Research</a>
  <a class="active" href="publications.html">Publications</a>
  <a href="patents.html">Patents</a>
</div>
<div class="content">
  <a class="back-link" href="index.html">&larr; Back to Home</a>
  <h1>Full Publications</h1>
  <p class="page-subtitle">A complete list of research outputs by Junsu Ha</p>
  <div id="pub-list"></div>
</div>
<footer>&copy; 2026 Junsu Ha</footer>
<script src="pubs-data.js"></script>
<script>
  const listEl = document.getElementById("pub-list");
  const total = publications.length;
  let lastYear = null;
  publications.forEach((pub, i) => {
    const number = total - i;
    const roleClass = /first|corresponding/i.test(pub.role) ? "role-first" : "";

    if (pub.year !== lastYear) {
      const yearHeading = document.createElement("div");
      yearHeading.className = "year-heading";
      yearHeading.textContent = pub.year;
      listEl.appendChild(yearHeading);
      lastYear = pub.year;
    }

    const titleHtml = pub.link
      ? `<a href="${pub.link}" target="_blank" rel="noopener">${pub.title}</a>`
      : pub.title;

    const item = document.createElement("div");
    item.className = "pub-item";
    item.innerHTML = `
      <div class="pub-main">
        <div class="pub-badges">
          <span class="pub-number">${number}</span>
          <span class="pub-tag">${pub.journal}</span>
          <span class="pub-tag">${pub.year}</span>
          ${pub.status ? `<span class="pub-tag status-tag">${pub.status}</span>` : ""}
          <span class="pub-tag ${roleClass}">${pub.role}</span>
        </div>
        <div class="pub-title">${titleHtml}</div>
        <div class="pub-authors">${pub.authors}</div>
        <div class="pub-journal">${pub.journalFull}</div>
        ${pub.note ? `<div class="pub-note">${pub.note}</div>` : ""}
      </div>
      ${pub.toc ? `
      <div class="pub-toc">
        <img src="${pub.toc}" alt="TOC image for publication ${number}"
             onerror="this.parentElement.style.display='none';">
      </div>` : ""}
    `;
    listEl.appendChild(item);
  });
</script>
</body>
</html>
