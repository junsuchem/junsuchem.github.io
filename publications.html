<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Publications | Junsu Ha</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #222;
    line-height: 1.6;
  }

  /* 상단 네비게이션 */
  .navbar {
    background-color: #333;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  .navbar a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
    font-size: 17px;
  }
  .navbar a:hover { background-color: #ddd; color: black; }
  .navbar a.active { background-color: #002F5F; color: white; }

  .content { padding: 40px 20px; max-width: 850px; margin: 0 auto; }

  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    color: #002F5F;
    text-decoration: none;
    font-weight: bold;
  }
  .back-link:hover { text-decoration: underline; }

  h1 { margin-bottom: 4px; }
  .page-subtitle { color: #666; margin-bottom: 36px; }

  /* 각 논문 항목 */
  .pub-item {
    display: flex;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid #e5e5e5;
  }
  .pub-item:first-of-type { border-top: 1px solid #e5e5e5; }

  /* TOC 이미지 */
  .pub-toc img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #f7f7f7;
    flex-shrink: 0;
  }

  .pub-main { flex: 1; min-width: 0; }

  .pub-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    font-size: 0.85em;
  }
  .pub-number {
    background: #333;
    color: white;
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: bold;
  }
  .pub-tag {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 2px 10px;
    color: #444;
  }
  .pub-tag.role-first {
    background: #e6f7ef;
    border-color: #002F5F;
    color: #002F5F;
    font-weight: bold;
  }

  .pub-title { font-size: 1.1em; font-weight: bold; margin-bottom: 6px; }
  .pub-authors { font-size: 0.95em; color: #333; margin-bottom: 4px; }
  .pub-authors .me { text-decoration: underline; }
  .pub-journal { font-size: 0.95em; color: #555; margin-bottom: 4px; }
  .pub-note { font-size: 0.9em; color: #777; font-style: italic; margin-bottom: 4px; }
  .pub-link {
    font-size: 0.9em;
    color: #002F5F;
    text-decoration: none;
    font-weight: bold;
  }
  .pub-link:hover { text-decoration: underline; }

  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 0.85em;
    border-top: 1px solid #eee;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html#home">Home</a>
  <a href="index.html#profile">Profile</a>
  <a href="index.html#research">Research</a>
  <a class="active" href="publications.html">Publications</a>
  <a href="index.html#patents">Patents</a>
</div>

<div class="content">
  <a class="back-link" href="index.html">&larr; Back to Home</a>
  <h1>Full Publications</h1>
  <p class="page-subtitle">A complete list of research outputs by Junsu Ha</p>

  <div id="pub-list"></div>
</div>

<footer>&copy; 2026 Junsu Ha</footer>

<script>
/* ============================================================
   여기에 논문을 추가/수정하세요.
   배열의 첫 항목이 리스트의 맨 위(최신)로 표시됩니다.
   번호는 자동으로 매겨지므로 순서만 신경 쓰면 됩니다.

   각 필드 설명:
   - journal   : 저널 약칭 (배지에 표시, 예: "Angew. Chem. Int. Ed.")
   - year      : 연도 (배지에 표시)
   - role      : "First author" | "Co-author" | "Corresponding author" 등
   - title     : 논문 제목
   - authors   : 저자 목록 문자열. 본인 이름은 <span class="me">Ha, J.</span>
                 처럼 감싸면 밑줄로 강조됩니다.
   - journalFull : 정식 인용 표기 (저널명, 연도, 권, 페이지 등)
   - note      : (선택) Hot Paper, Cover feature 등 추가 코멘트. 없으면 "" 로 둘 것
   - link      : DOI 또는 논문 링크. 없으면 "" 로 둘 것
   - toc       : TOC 이미지 파일 경로. 이미지 파일을 같은 폴더의
                 예: "toc/pub01.jpg" 형태로 넣고 경로만 맞춰주면 됩니다.
                 파일이 없으면 빈 이미지 박스로 표시됩니다.
   ============================================================ */

  const publications = [
    {
      journal: "Angew. Chem. Int. Ed.",
      year: "2026",
      role: "First author",
      title: "[논문 제목을 여기에 입력]",
      authors: '<span class="me">Ha, J.</span>; Co-author, A.; Corresponding, W.*;',
      journalFull: "<em>Angew. Chem. Int. Ed.</em> <strong>2026</strong>, submitted",
      note: "",
      link: "",
      toc: "toc/pub01.jpg"
    },
    {
      journal: "J. Am. Chem. Soc.",
      year: "2025",
      role: "Co-author",
      title: "[두 번째 논문 제목 예시]",
      authors: 'First, A.; <span class="me">Ha, J.</span>; Corresponding, W.*;',
      journalFull: "<em>J. Am. Chem. Soc.</em> <strong>2025</strong>, <em>147</em>, 1234\u20131240.",
      note: "Featured on the cover.",
      link: "https://doi.org/xx.xxxx/xxxxx",
      toc: "toc/pub02.jpg"
    }
    // 새 논문 추가 시 여기 아래에 { ... }, 형태로 계속 이어 붙이면 됩니다.
  ];

  const listEl = document.getElementById("pub-list");
  const total = publications.length;

  publications.forEach((pub, i) => {
    const number = total - i; // 최신 항목이 가장 큰 번호를 갖도록 (원본 사이트 방식)
    const roleClass = pub.role.toLowerCase().includes("first") ? "role-first" : "";

    const item = document.createElement("div");
    item.className = "pub-item";

    item.innerHTML = `
      <div class="pub-toc">
        <img src="${pub.toc}" alt="TOC image for publication ${number}"
             onerror="this.style.opacity=0.3; this.alt='TOC image not found';">
      </div>
      <div class="pub-main">
        <div class="pub-badges">
          <span class="pub-number">${number}</span>
          <span class="pub-tag">${pub.journal}</span>
          <span class="pub-tag">${pub.year}</span>
          <span class="pub-tag ${roleClass}">${pub.role}</span>
        </div>
        <div class="pub-title">${pub.title}</div>
        <div class="pub-authors">${pub.authors}</div>
        <div class="pub-journal">${pub.journalFull}</div>
        ${pub.note ? `<div class="pub-note">${pub.note}</div>` : ""}
        ${pub.link ? `<a class="pub-link" href="${pub.link}" target="_blank" rel="noopener">Link &gt;</a>` : ""}
      </div>
    `;

    listEl.appendChild(item);
  });
</script>

</body>
</html>
